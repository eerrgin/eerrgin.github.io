[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ergin-runtime-observatory"
version = "0.1.0"
description = "Local Python runtime measurements and profiling reports for Ergin Atolye"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ergin Atolye" }]
dependencies = []

[project.scripts]
ergin-observe = "ergin_observatory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
