<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEIL // Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505;
      --surface: #0c0c0c;
      --border: #1f1f1f;
      --border-hover: #2a2a2a;
      --text: #e8e8e8;
      --muted: #6b6b6b;
      --accent: #00e5c0;
      --accent-dim: rgba(0, 229, 192, 0.12);
      --danger: #ff4d6a;
      --warn: #f0b429;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 229, 192, 0.06), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(0, 80, 60, 0.05), transparent);
    }

    /* ── LOGIN ── */
    #login-screen {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    #login-screen::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5;
    }

    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(0, 229, 192, 0.2);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    .login-badge .dot {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    #login-screen h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    #login-screen .sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    #pass-input {
      width: 100%;
      padding: 14px 16px;
      background: #0a0a0a;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      text-align: center;
      letter-spacing: 0.08em;
      margin-bottom: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #pass-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    #pass-input::placeholder { color: #3a3a3a; letter-spacing: 0.04em; }

    #login-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }

    #login-btn:hover { opacity: 0.9; }
    #login-btn:active { transform: scale(0.98); }

    .login-footer {
      margin-top: 24px;
      font-size: 11px;
      color: #3a3a3a;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── DASHBOARD ── */
    #dashboard {
      display: none;
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      background: #080808;
    }

    .dash-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .dash-title h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .status-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 3px 8px;
      border-radius: 999px;
    }

    .dash-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      border-color: var(--border-hover);
      color: var(--text);
    }

    .dash-body {
      padding: 20px 24px 28px;
      max-height: 62vh;
      overflow-y: auto;
    }

    .dash-body::-webkit-scrollbar { width: 6px; }
    .dash-body::-webkit-scrollbar-track { background: transparent; }
    .dash-body::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }

    .empty-state .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #3a3a3a;
      margin-top: 8px;
    }

    .msg-card {
      background: #0a0a0a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 12px;
      transition: border-color 0.15s;
    }

    .msg-card:hover { border-color: var(--border-hover); }

    .msg-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .msg-name {
      font-weight: 600;
      font-size: 14px;
      color: var(--accent);
    }

    .msg-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
    }

    .msg-body {
      font-size: 14px;
      line-height: 1.55;
      color: #c8c8c8;
      white-space: pre-wrap;
    }

    .dash-footer {
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #3a3a3a;
      font-family: 'JetBrains Mono', monospace;
      background: #080808;
    }

    .dash-footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    .dash-footer a:hover { color: var(--text); }

    .error-shake {
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen">
    <div class="login-badge"><span class="dot"></span> VEIL ACCESS</div>
    <h1>Admin Node</h1>
    <p class="sub">Bu katman yalnızca yetkili sinyal için açık.<br>Kod olmadan içerik görünmez.</p>
    <input type="password" id="pass-input" placeholder="access code" autocomplete="off" spellcheck="false">
    <button id="login-btn">Unlock</button>
    <div class="login-footer">0xB16B00B5_NODE · local-first</div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">
    <div class="dash-header">
      <div class="dash-title">
        <h1>Message Inbox</h1>
        <span class="status-pill">LIVE</span>
      </div>
      <div class="dash-actions">
        <button class="icon-btn" id="refresh-btn">↻ Refresh</button>
        <button class="icon-btn" id="lock-btn">Lock</button>
      </div>
    </div>

    <div class="dash-body" id="message-list">
      <!-- filled by JS -->
    </div>

    <div class="dash-footer">
      <span id="msg-count">—</span>
      <a href="index.html">← ana siteye dön</a>
    </div>
  </div>

  <script>
    // ── Access code (themed, not sensitive) ──
    // Hint sits in plain sight on the main site status line.
    const ACCESS_CODE = "0xB16B00B5";

    // Local mock archive — no external dependency.
    // Looks real, stays offline, never phones home.
    const SEED_MESSAGES = [
      {
        name: "anon-07",
        message: "llms.txt dosyasını okudum. STATUS satırı bilerek mi konmuş?",
        time: "16 Eki 2026 · 23:41"
      },
      {
        name: "yerel_gözlemci",
        message: "VeilCheck çıktısında false-positive oranı beklediğimden düşük çıktı. Heuristik güzel kalibre edilmiş.",
        time: "15 Eki 2026 · 14:12"
      },
      {
        name: "kırıntı",
        message: "masaya bırakılmış şeyler bölümü çok hoşuma gitti. yarın kalkabilir demek yetiyor.",
        time: "14 Eki 2026 · 09:03"
      },
      {
        name: "signal",
        message: "kod yarına kalır, yanına kalmaz.\nbu cümleyi bir yere not ettim.",
        time: "13 Eki 2026 · 21:55"
      },
      {
        name: "visitor",
        message: "Site karanlık ama sıcak. Nadir bir denge.",
        time: "12 Eki 2026 · 18:30"
      }
    ];

    const loginScreen = document.getElementById("login-screen");
    const dashboard   = document.getElementById("dashboard");
    const passInput   = document.getElementById("pass-input");
    const loginBtn    = document.getElementById("login-btn");
    const messageList = document.getElementById("message-list");
    const msgCount    = document.getElementById("msg-count");
    const refreshBtn  = document.getElementById("refresh-btn");
    const lockBtn     = document.getElementById("lock-btn");

    function renderMessages(list) {
      if (!list.length) {
        messageList.innerHTML = `
          <div class="empty-state">
            <p>Henüz sinyal yok.</p>
            <p class="code">inbox://empty</p>
          </div>`;
        msgCount.textContent = "0 mesaj";
        return;
      }

      messageList.innerHTML = list.map(m => `
        <div class="msg-card">
          <div class="msg-meta">
            <span class="msg-name">${escapeHtml(m.name)}</span>
            <span class="msg-time">${escapeHtml(m.time)}</span>
          </div>
          <div class="msg-body">${escapeHtml(m.message)}</div>
        </div>
      `).join("");

      msgCount.textContent = `${list.length} mesaj · yerel arşiv`;
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    function unlock() {
      loginScreen.classList.add("hidden");
      dashboard.style.display = "block";
      renderMessages(SEED_MESSAGES);
      // Optional: remember session for this tab only
      try { sessionStorage.setItem("veil_unlocked", "1"); } catch (_) {}
    }

    function lock() {
      dashboard.style.display = "none";
      loginScreen.classList.remove("hidden");
      passInput.value = "";
      passInput.focus();
      try { sessionStorage.removeItem("veil_unlocked"); } catch (_) {}
    }

    function attemptLogin() {
      const val = passInput.value.trim();
      if (val === ACCESS_CODE) {
        unlock();
      } else {
        passInput.classList.add("error-shake");
        passInput.style.borderColor = "var(--danger)";
        setTimeout(() => {
          passInput.classList.remove("error-shake");
          passInput.style.borderColor = "";
        }, 400);
      }
    }

    loginBtn.addEventListener("click", attemptLogin);
    passInput.addEventListener("keydown", e => {
      if (e.key === "Enter") attemptLogin();
    });

    refreshBtn.addEventListener("click", () => renderMessages(SEED_MESSAGES));
    lockBtn.addEventListener("click", lock);

    // Auto-unlock if already authenticated in this session
    try {
      if (sessionStorage.getItem("veil_unlocked") === "1") unlock();
    } catch (_) {}

    // Focus input on load
    passInput.focus();
  </script>
</body>
</html>
