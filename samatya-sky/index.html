  <canvas id="sky" role="img" aria-label="Samatya ufkunda yıldızların ve gök cisimlerinin etkileşimli üç boyutlu simülasyonu">Gökyüzü çizimi yüklenemedi. WebGL destekleyen güncel bir tarayıcı kullan.</canvas>

      <a href="../">e.</a>
