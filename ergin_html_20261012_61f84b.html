<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ergin Teknik Atölye · Siberpunk Kontrol Paneli</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #050505;
            color: #00ffcc;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        .dashboard {
            width: 90%;
            max-width: 1000px;
            z-index: 1;
        }

        .glass-panel {
            background: rgba(0, 20, 20, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #00ffcc;
        }

        h1 {
            font-size: 1.5rem;
            text-shadow: 0 0 10px #00ffcc;
        }

        #clock {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #fff;
        }

        .metric {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .metric span {
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 0 5px #00ffcc;
        }

        .bar-bg {
            width: 100%;
            height: 10px;
            background: rgba(0, 255, 204, 0.1);
            border-radius: 5px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
            transition: width 0.3s ease;
        }

        .terminal {
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .blink {
            animation: blink 1s step-start infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <canvas id="matrixCanvas"></canvas>
    
    <div class="dashboard">
        <header class="glass-panel">
            <h1>SİSTEM ÇEVRİMİÇİ</h1>
            <div id="clock">00:00:00</div>
        </header>

        <main class="grid-container">
            <div class="card glass-panel">
                <h2>İşlemci (CPU)</h2>
                <div class="metric">
                    <span id="cpu-val">0%</span>
                    <div class="bar-bg"><div id="cpu-bar" class="bar-fill"></div></div>
                </div>
            </div>
            <div class="card glass-panel">
                <h2>Bellek (RAM)</h2>
                <div class="metric">
                    <span id="ram-val">0%</span>
                    <div class="bar-bg"><div id="ram-bar" class="bar-fill"></div></div>
                </div>
            </div>
            <div class="card glass-panel">
                <h2>Ağ Trafiği</h2>
                <div class="metric">
                    <span id="net-val">0 MB/s</span>
                    <div class="bar-bg"><div id="net-bar" class="bar-fill"></div></div>
                </div>
            </div>
        </main>

        <footer class="glass-panel terminal">
            <p>> Sistem başlatıldı...</p>
            <p>> Güvenlik protokolleri aktif.</p>
            <p class="blink">> _</p>
        </footer>
    </div>

    <script>
        // Saat Güncelleme
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('tr-TR');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Rastgele Sistem Metrikleri Simülasyonu
        function updateMetrics() {
            const cpu = Math.floor(Math.random() * 100);
            const ram = Math.floor(Math.random() * 100);
            const net = (Math.random() * 500).toFixed(2);

            document.getElementById('cpu-val').innerText = cpu + '%';
            document.getElementById('cpu-bar').style.width = cpu + '%';

            document.getElementById('ram-val').innerText = ram + '%';
            document.getElementById('ram-bar').style.width = ram + '%';

            document.getElementById('net-val').innerText = net + ' MB/s';
            document.getElementById('net-bar').style.width = (net / 5) + '%';
        }
        setInterval(updateMetrics, 1500);
        updateMetrics();

        // Matrix Arka Plan Animasyonu
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ffcc';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
