name: Ergin Atolye Quality Gate
on:
  push:
    paths:
      - "ergin-ustalik-rotasi/**"
      - ".github/workflows/ergin-ustalik-rotasi-quality.yml"
  pull_request:
    paths:
      - "ergin-ustalik-rotasi/**"
      - ".github/workflows/ergin-ustalik-rotasi-quality.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files and HTML structure
        shell: bash
        run: |
          set -euo pipefail
          test -s ergin-ustalik-rotasi/index.html
          test -s ergin-ustalik-rotasi/PLAN.md
          test -s ergin-ustalik-rotasi/README.md
          test -s ergin-ustalik-rotasi/LICENSE
          test -s ergin-ustalik-rotasi/NOTICE.md
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = []
              def handle_starttag(self, tag, attrs):
                  self.tags.append(tag)
          html = Path("ergin-ustalik-rotasi/index.html").read_text(encoding="utf-8")
          check = Check(); check.feed(html)
          assert check.tags.count("html") == 1
          assert check.tags.count("body") == 1
          assert "</html>" in html.lower()
          assert "ergin-ustalik-rotasi.progress.v1" in html
          print("Required files and HTML checks passed.")
          PY
  python-observatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests and emit a sample profile report
        run: |
          cd ergin-ustalik-rotasi/projects/runtime-observatory
          PYTHONPATH=src python -m unittest discover -s tests -v
          PYTHONPATH=src python -m ergin_observatory.cli --output /tmp/runtime-report.json --profile
          python -c "import json; json.load(open('/tmp/runtime-report.json', encoding='utf-8'))"
  grounded-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run local retrieval and schema tests
        run: |
          cd ergin-ustalik-rotasi/projects/grounded-knowledge-workshop
          node --test
  java-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile and run tenant/idempotency/breaker smoke tests
        run: |
          cd ergin-ustalik-rotasi/projects/transaction-audit-platform
          mkdir -p out
          javac -d out $(find src/main/java src/test/java -name '*.java')
          java -ea -cp out tr.erginatolye.ledger.SelfTest
