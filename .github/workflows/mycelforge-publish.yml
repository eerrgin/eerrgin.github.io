name: Publish MycelForge on eerrgin.github.io

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".github/workflows/mycelforge-publish.yml"
      - "mycelforge/**"
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-mycel-forge
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out personal website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch MycelForge source
        run: git clone --depth 1 https://github.com/eerrgin/mycelforge.git _work/mycelforge

      - name: Install MycelForge dependencies
        working-directory: _work/mycelforge
        run: npm ci --no-audit --no-fund

      - name: Test formulation engine
        working-directory: _work/mycelforge
        run: npm run test:mycel

      - name: Verify command-line examples
        working-directory: _work/mycelforge
        run: npm run forge -- --json

      - name: Build MycelForge for the website path
        working-directory: _work/mycelforge
        run: npm run build:pages

      - name: Publish the static application
        shell: bash
        run: |
          mkdir -p mycelforge
          rm -rf mycelforge/assets
          mkdir -p mycelforge/assets
          cp _work/mycelforge/dist-pages/pages.html mycelforge/index.html
          cp _work/mycelforge/dist-pages/assets/* mycelforge/assets/
          cat > mycelforge/README.txt <<'EOF'
          MycelForge static web build
          Source: https://github.com/eerrgin/mycelforge
          This directory is generated by .github/workflows/mycelforge-publish.yml.
          Do not edit generated bundles manually. Change the source repository instead.
          EOF
          if git diff --quiet -- mycelforge/ && [ -z "$(git ls-files --others --exclude-standard -- mycelforge/)" ]; then
            echo "MycelForge website bundle is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mycelforge/
          git commit -m "chore: publish MycelForge web build"
          git push origin HEAD:main
