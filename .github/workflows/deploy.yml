name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          ADMIN_ACCESS_CODE: ${{ secrets.ADMIN_ACCESS_CODE }}
        run: |
          mkdir -p _site/js
          shopt -s extglob
          for item in * .*; do
            case "$item" in
              .|..|_site|.git|.github|node_modules|dist|package.json|pnpm-lock.yaml|vite.config.js|gitignore.txt|npmrc.txt|env.development.local|env.production.local|inde.html) continue ;;
            esac
            cp -a "$item" _site/ 2>/dev/null || true
          done
          cat > _site/js/firebase-config.js <<EOF
export const firebaseConfig = {
  apiKey: "${FIREBASE_API_KEY}",
  authDomain: "eerrgin-site.firebaseapp.com",
  projectId: "eerrgin-site",
  storageBucket: "eerrgin-site.firebasestorage.app",
  messagingSenderId: "588154027449",
  appId: "1:588154027449:web:fc95ce4cffc35f351b8a68"
};
export const adminAccessCode = "${ADMIN_ACCESS_CODE}";
EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
